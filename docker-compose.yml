services:

  # ── MongoDB ──
  mongodb:
    image: mongo:6
    container_name: tikmarket-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tikmarket
    volumes:
      - mongodb_data:/data/db
    networks:
      - tikmarket-network

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: tikmarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tikmarket-network

  # ── RabbitMQ ──
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tikmarket-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tikmarket-network

  # ── Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tikmarket-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/tikmarket
      JWT_SECRET: tikmarket_super_secret_key_2024
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - tikmarket-network

  # ── Frontend ──
  frontend:
    build:
      context: ./tikmarket-frontend
      dockerfile: ../Dockerfile.frontend
    container_name: tikmarket-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - tikmarket-network

  # ── Jenkins ──
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tikmarket-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tikmarket-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  jenkins_data:

networks:
  tikmarket-network:
    driver: bridge
